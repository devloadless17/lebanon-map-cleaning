# Only Caddy publishes host ports.
#
# This is the actual security boundary, not UFW: Docker writes its own iptables rules and
# bypasses UFW entirely for published ports, so "-p 5432:5432" would expose the database to the
# whole internet even with UFW showing only 22/80/443 open.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3 — remove this AND pin protocols in the Caddyfile if UDP/443 is dropped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certs + ACME account: losing this means reissue and rate-limit risk
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18 places data in a version-specific subdirectory; mounting .../data directly
      # makes the image refuse to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${DOCKER_USERNAME}/lebanon-cleaning-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: [.env]
    environment:
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${DOCKER_USERNAME}/lebanon-cleaning-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      PORT: 4101
      HOSTNAME: '0.0.0.0'
      # Server-side rewrite target. Same hostname in the browser means the session cookie is
      # simply sent, with no cross-site cookie problem to solve.
      API_ORIGIN: http://api:4100
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
